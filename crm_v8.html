.g{border-collapse:separate;border-spacing:0;font-size:13px}

.at td.H{background:color-mix(in srgb,var(--card) 78%,var(--wn));color:var(--wn);font-weight:600}
.at td.A{background:color-mix(in srgb,var(--card) 78%,var(--bad));color:var(--bad);font-weight:600}
.tchip{display:inline-block;padding:3px 12px;border:1px solid var(--bd);border-radius:99px;font-size:12px;cursor:pointer;color:var(--mu)}
/* everything centred */
body,header,.card,.row,td,th,label,small,.mu,dialog,.empty,.hd,.stat,p{text-align:center}
.top{flex-direction:column;gap:6px;justify-content:center}h1{margin:0}

#who{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}#who .btn{padding:6px 12px}

.lgc{width:min(400px,100%);padding:24px}.lgc h2{margin:0 0 6px;font-size:22px}.lgc input{margin-bottom:10px}.lgc .neg{min-height:20px;margin-bottom:8px}

/* bigger, roomier layout on laptops and desktops */

<script>

function run(rep){let nn=D.n,rp=[];const give=(set,w)=>{w=+w;if(w&&!set.has(w)){set.add(w);if(w>=nn)nn=w+1;return w}while(set.has(nn))nn++;set.add(nn);return nn++};

if(R.Attendance){if(rep){D.a={};D.t={}}let a=0,d=0,b=0;R.Attendance.forEach(r=>{const dt=dtp(r.Date),p=find(r["Person ID"],r.Person,r.Manager,pool());if(!dt||!p){b++;return}const k=dt+"|"+p.id;if(D.a[k]){d++;return}D.a[k]=sv(r.Status);const i=tmv(r["In time"]),o=tmv(r["Out time"]);if(i||o)D.t[k]={i,o};a++});rp.push(`Attendance: ${a} added, ${d} skipped, ${b} ignored`)}

ev.sort((a,b)=>a.d.localeCompare(b.d)||a.o-b.o);let b=0;ev.forEach(e=>{b=e.o?e.c:b+e.v});return b};

window.nillDlg=id=>{const w=D.w.find(x=>x.id==id);$("#dlg").innerHTML=`<b class="up">Hisab Nill: ${esc(w.n)}</b><label>Nill ki date (kisi bhi din ka)</label><input id="ndt" type="date" value="${dflt()}" onchange="nillCalc(${id})"><div id="nbox"></div><label>Is date ke baad carry (previous balance) (₹)</label><input id="ncv" type="number" inputmode="decimal"><div class="bar" id="nbtn" style="margin-top:8px;flex-wrap:wrap"></div><small>Is date tak ki saari entries aur remarks jaisi hain waisi hi rahengi. Bas hisaab nill hoga, aur jo amount carry likhoge wahi aage previous balance banega. Koi amount advance mein dobara add nahi hota.</small><div id="ner" style="color:#dc2626;font-size:13px;margin-top:6px"></div><div class="acts"><button class="nb ou big" onclick="$('#dlg').close()">Cancel</button><button class="nb big" onclick="nillOk(${id})">Nill karo</button></div>`;nillCalc(id);$("#dlg").showModal()};
window.nillOk=id=>{const d0=$("#ndt").value,v=+$("#ncv").value;if(!d0){$("#ner").textContent="Date chuno";return}if(D.nl&&D.nl[id+"|"+d0]){$("#ner").textContent="Is date par nill pehle se hai. Pehle Undo karo.";return}

window.__nlinfo=info;window.__nlact=act;window.__nlcarry=carryOf;const t0=T.adv.top;T.adv.top=()=>t0()+`<div class="bar" style="flex-wrap:wrap"><button class="nb big ou" onclick="xsDlg()">Excel sheet</button>${av=="s"?`<button class="nb big" onclick="nillAllDlg()">Hisab Nill: all workers</button>`:""}</div>`;

<script>
(function(){
const S=v=>String(v??"").trim(),N=v=>S(v).toUpperCase().replace(/\s+/g," "),MNAME=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const iso=v=>{if(typeof v=="number"&&v>20000&&v<90000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const s=S(v);if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:""};
const xm=h=>{$("#xs").innerHTML=h};let XP=null;
const coOf=t=>{const u=N(t);return D.cos.findIndex(c=>u.includes(N(c.m)))+1};
const NB=n=>N(n)=="BLANK"?"BLANK (EXTRA SHEET SLOT)":S(n),RE_N=/JAMA|NILL|HISAB/,RE_R=/RETURN|RTN/;
/* one cell -> one entry. Nothing is ignored: text in Amount (e.g. HISABB NILL) and remark-only cells become Nill entries */
const mk=(d,am,rm)=>{const u=N(rm);let amt=0,note,t;
if(typeof am=="number"){amt=Math.abs(am);note=rm||"CASH";t=am<0||RE_R.test(u)?"r":RE_N.test(u)?"n":"g"}
else if(S(am)===""){note=rm;t="n"}
else if(/^[\d.,₹\s-]+$/.test(S(am))&&isFinite(parseFloat(S(am).replace(/[₹,\s]/g,"")))){const x=parseFloat(S(am).replace(/[₹,\s]/g,""));amt=Math.abs(x);note=rm||"CASH";t=x<0||RE_R.test(u)?"r":RE_N.test(u)?"n":"g"}
else{note=S(am)+(rm?" "+rm:"");t="n"}
return{d,amt,note,t}};
const nn=n=>String(n||"").trim().toUpperCase()||"CASH",KY=(w,r)=>[w,r.d,r.t,+r.amt,nn(r.note)].join("|"),KA=a=>[a.w,a.d,a.t,+a.amt,nn(a.note)].join("|");
/* find every "Date | Amount | Remarks" block anywhere in the sheet; name = text just above; also read the sheet's own FINAL TOTAL ADV for checking */
function parse(a){const blocks=[];let bad=0;for(let i=0;i<a.length;i++)for(let j=0;j<(a[i]||[]).length-2;j++){
if(N(a[i][j])!="DATE"||N(a[i][j+1])!="AMOUNT"||!/^REMARKS?$/.test(N(a[i][j+2])))continue;
let nm="";for(let k=i-1;k>=Math.max(0,i-3)&&!nm;k--){const v=S((a[k]||[])[j]);if(v&&N(v)!="DATE")nm=v}
if(!nm)nm=S((a[i-1]||[])[j+1])||S((a[i-1]||[])[j-1]);const rows=[];let k=i+1;
for(;k<a.length&&k<i+45;k++){const r=a[k]||[],dv=r[j];if(dv!==""&&dv!=null&&!iso(dv))break;const am=r[j+1],rm=S(r[j+2]);if((am===""||am==null)&&!rm)continue;const d=iso(dv);if(!d){bad++;continue}rows.push(mk(d,am,rm))}
let fin=null;for(let q=k;q<Math.min(a.length,k+12);q++){if(N((a[q]||[])[j])=="FINAL TOTAL ADV"){const v=(a[q]||[])[j+1];if(typeof v=="number")fin=v;break}}
blocks.push({nm,rows,fin})}return{blocks,bad}}
function plan(wb){const R=[];wb.SheetNames.forEach(sn=>{const p=parse(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""}));if(p.blocks.some(b=>b.rows.length))R.push({sn,c:coOf(sn)||(+co||+dc()),...p})});return R}
const cw=s=>{const by={};D.w.filter(w=>w.c==s.c).forEach(w=>{if(!by[N(w.n)])by[N(w.n)]=w});return by};
const mset=s=>{const m=new Set();s.blocks.forEach(b=>b.rows.forEach(r=>m.add(r.d.slice(0,7))));return m};
const crmFin=(w,mo)=>D.adv.reduce((t,a)=>t+(a.w==w.id&&mo.has(a.d.slice(0,7))?(a.t=="g"?+a.amt:a.t=="r"?-a.amt:0):0),0);
function check(s){const by=cw(s),mo=mset(s),bad=[],X=new Map();s.blocks.forEach(b=>{if(b.fin==null||!NB(b.nm))return;const k=N(NB(b.nm));X.set(k,{nm:NB(b.nm),x:(X.has(k)?X.get(k).x:0)+b.fin})});X.forEach((e,k)=>{const w=by[k],c=w?crmFin(w,mo):0;if(Math.abs(c-e.x)>.5)bad.push({nm:e.nm,x:e.x,c,co:cn(s.c)})});return{n:X.size,bad}}
function delSet(){const mo=new Set(),cs=new Set();XP.forEach(s=>{cs.add(s.c);mset(s).forEach(m=>mo.add(m))});const all=D.cos.every((c,i)=>c.x||cs.has(i+1)),ids=new Set(D.w.filter(w=>cs.has(+w.c)).map(w=>w.id));return{all,pred:a=>(all||ids.has(a.w))&&mo.has(a.d.slice(0,7))}}
function stats(s){const by=cw(s),have=new Set(D.adv.map(KA));let ent=0,dup=0,wc=0;const nws=[];
s.blocks.forEach(b=>{if(!b.rows.length||!NB(b.nm))return;wc++;const w=by[N(NB(b.nm))];if(!w)nws.push(NB(b.nm));b.rows.forEach(r=>{ent++;if(w&&have.has(KY(w.id,r)))dup++})});return{ent,dup,wc,nws,chk:check(s)}}
function report(rep,add,dup,nw,del){const R=XP.map(s=>check(s)),bad=R.flatMap(r=>r.bad),n=R.reduce((a,r)=>a+r.n,0);
$("#dlg").innerHTML=`<b class="up">Import ho gaya</b><div class="card" style="margin:10px 0">${add} entries add · ${dup} pehle se thi · ${nw} naye workers${rep?` · ${del} purani entries hataayi`:""}</div>`+(bad.length?`<div style="color:#dc2626;font-weight:700">⚠ ${bad.length} workers ka total Excel se match nahi hua</div><div style="max-height:160px;overflow:auto;font-size:13px;margin:6px 0">${bad.slice(0,15).map(b=>`${esc(b.nm)} (${esc(b.co)}): Excel ${fmt(b.x)} · CRM ${fmt(b.c)}`).join("<br>")}</div><small>Isse theek karne ke liye dobara import karo aur <b>REPLACE</b> dabao, wo purani ya extra entries hata deta hai.</small>`:`<div style="color:#15803d;font-weight:700">✓ Excel ke ${n} workers ka FINAL TOTAL ADV CRM se bilkul match hai</div>`)+`<div class="acts"><button class="nb big" onclick="$('#dlg').close()">OK</button></div>`;$("#dlg").showModal()}
function apply(rep){let nw=0,add=0,dup=0,del=0;const DS=delSet();if(rep){const b4=D.adv.length;D.adv=D.adv.filter(a=>!DS.pred(a));del=b4-D.adv.length}
XP.forEach(s=>{const by=cw(s),wk=new Map();
s.blocks.forEach(b=>{if(!b.rows.length||!NB(b.nm))return;let w=by[N(NB(b.nm))];if(!w){w={id:D.n++,n:NB(b.nm),c:String(s.c),wg:0,r:""};D.w.push(w);by[N(w.n)]=w;nw++}wk.set(b,w)});
const have=new Set(D.adv.map(KA));
s.blocks.forEach(b=>{const w=wk.get(b);if(!w)return;b.rows.forEach(r=>{const k=KY(w.id,r);if(have.has(k)){dup++;return}have.add(k);D.adv.push({id:D.n++,w:w.id,d:r.d,t:r.t,amt:r.amt,note:r.note});add++})})});
save();render();report(rep,add,dup,nw,del)}
function read(file){if(!window.XLSX)return xm("Excel library load nahi hui. Internet check karo.");const fr=new FileReader();fr.onload=()=>{try{const wb=XLSX.read(fr.result,{type:"array"});XP=plan(wb);
if(!XP.length)return xm("Is file mein ‘Date | Amount | Remarks’ wale blocks nahi mile. Neeche ‘Download’ se banayi hui file ka format use karo.");
const tot=XP.map(s=>({s,t:stats(s)})),DS=delSet(),dn=D.adv.filter(DS.pred).length,nb=tot.reduce((a,x)=>a+x.t.chk.bad.length,0);
xm(tot.map(({s,t})=>`<div class="card" style="margin-bottom:8px"><b>${esc(s.sn)}</b> → ${esc(cn(s.c))}<br>${t.wc} workers · <b>${t.ent}</b> entries · ${t.ent-t.dup} nayi · ${t.dup} pehle se hain${t.nws.length?`<br><small style="color:#d97706">NAYE WORKERS (${t.nws.length}): ${esc(t.nws.slice(0,10).join(", "))}${t.nws.length>10?"…":""}</small>`:""}<br>${t.chk.bad.length?`<span style="color:#dc2626">⚠ ${t.chk.bad.length} workers ka total abhi Excel se alag hai</span><br><small>${t.chk.bad.slice(0,4).map(b=>esc(b.nm)+": Excel "+fmt(b.x)+" · CRM "+fmt(b.c)).join(" | ")}</small>`:`<span style="color:#15803d">✓ Total Excel se match</span>`}</div>`).join("")
+`<div class="acts" style="flex-wrap:wrap"><button class="nb big" id="xa1">ADD NEW ENTRIES</button><button class="nb big ou" id="xa2">REPLACE (${dn} PURANI HATAO)</button></div><small>ADD: jo entry pehle se hai wo skip, baaki add. <b>REPLACE (sabse sahi, exact):</b> ${DS.all?"is month ki CRM ki saari advance entries":"in companies ki is month ki entries"} hata ke bilkul Excel jaisi bana deta hai.${nb?" <b style='color:#dc2626'>Total match nahi ho raha, to REPLACE dabao.</b>":""} Pehle Excel se ‘Download all data’ backup le lo.</small>`);
