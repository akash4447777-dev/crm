<style>

/* everything centred */
body,header,.card,.row,td,th,label,small,.mu,dialog,.empty,.hd,.stat,p{text-align:center}
.top{flex-direction:column;gap:6px;justify-content:center}h1{margin:0}

#lg{position:fixed;inset:0;z-index:1000;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}

D.adv.forEach(a=>{if(!ids.has(a.w))return;const m=+a.amt||0,u=(a.note||"").toUpperCase();
if(a.d.startsWith(gm)){const k=a.w+"|"+a.d,c=C[k]=C[k]||{amt:0,rem:"",n:0};c.amt+=m;if(!c.n)c.rem=a.t=="r"?"RETURN":u=="CASH"?"":a.note;c.n++;
const s=S[a.w]=S[a.w]||{adv:0,jama:0,on:0,cash:0,all:0,g:0,ret:0};s.all+=m;
if(a.t=="r")s.ret+=m;else{const A=u.includes("ADV"),O=u.includes("ONLINE");if(A)s.adv+=m;if(u.includes("JAMA"))s.jama+=m;if(O)s.on+=m;if(a.t=="g"){s.g+=m;if(!A&&!O)s.cash+=m}}}
else if(a.d<mk)P[a.w]=(P[a.w]||0)+(a.t=="r"?-m:a.t=="g"?m:0)});
return{W:onlyE?W.filter(w=>S[w.id]):W,C,S,P}}
const Z0={adv:0,jama:0,on:0,cash:0,all:0,g:0,ret:0},fin=s=>s.g-s.ret;
function setC(wid,d,amt,rem){
const es=D.adv.filter(a=>a.w==wid&&a.d==d);
if(!amt&&(!rem||["ADV","ONLINE","JAMA","NILL","CASH"].includes(rem))){D.adv=D.adv.filter(a=>!(a.w==wid&&a.d==d))}
else{const t=rem=="RETURN"?"r":(!rem||rem.includes("ADV")||rem.includes("ONLINE"))?"g":"n",note=rem=="RETURN"?"":rem||"CASH";
if(es.length){const e=es[0];e.amt=amt;e.t=t;e.note=note;D.adv=D.adv.filter(a=>!(a.w==wid&&a.d==d)||a===e)}else D.adv.push({id:D.n++,w:wid,d,t,amt,note})}
save()}

const c=cellOf(w,d),i=document.createElement("input");

i.value=k=="a"?(c.amt||""):c.rem;td.textContent="";td.appendChild(i);i.focus();

<script>
(function(){

const dtp=v=>{if(typeof v=="number"&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);v=S(v);const m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;return/^\d{4}-\d{2}-\d{2}/.test(v)?v.slice(0,10):""};

inn:r=>{const o={};F.forEach(([k,l,t])=>{const v=r[l];o[k]=k=="c"?String(mg(v)||dc()):t=="date"?dtp(v):(t=="number"||k=="g")?N(v):S(v)});if(no)o.no=N(r.No);return window.ACC?window.ACC.extendIn(n,r,o):o},
key:x=>F.map(([k])=>x[k]).join("|"),ok:o=>o.d&&(o.amt!==undefined?true:true)});

{n:"Attendance"},

function run(rep){if(window.ACC){const errors=window.ACC.validateImport(R,rep);if(errors.length){box("Import not applied. Fix these errors first:<br>"+errors.slice(0,20).map(esc).join("<br>")+(errors.length>20?"<br>More errors: "+(errors.length-20):""));return}}let nn=D.n,rp=[];const give=(set,w)=>{w=+w;if(w&&!set.has(w)){set.add(w);if(w>=nn)nn=w+1;return w}while(set.has(nn))nn++;set.add(nn);return nn++};
const merge=(s,old,rows,fix)=>{const out=rep?[]:old.slice(),set=new Set(out.map(x=>x.id)),keys=new Set(out.map(s.key));let a=0,d=0,b=0;rows.forEach(r=>{const o=fix?fix(r):s.inn(r);if(!o||(s.ok&&!s.ok(o))){b++;return}const k=s.key(o);if(keys.has(k)){d++;return}keys.add(k);o.id=give(set,r.ID);out.push(o);a++});rp.push(`${s.n}: ${a} added, ${d} skipped, ${b} ignored`);return out};

let na=0;if(R.Advances){const sp=by("Advances");D.adv=merge(sp,D.adv,R.Advances,r=>{const nm=S(r.Worker),dt=dtp(r.Date),am=r.Amount;if(!dt||am===""||isNaN(+am)||(!nm&&!r["Worker ID"]))return null;let w=find(r["Worker ID"],nm,r.Manager,W);if(!w){if(!nm)return null;w={id:0,n:nm,c:String(mg(r.Manager)||dc()),wg:0,r:""};const ws=new Set(W.map(x=>x.id));w.id=give(ws,0);W.push(w);na++}return{w:w.id,d:dt,t:ty(r.Type),amt:+am,note:S(r.Note)}})}

D.w=W;D.s=SF;
["Expenses","Income","Fund Transfers","Fund Advances"].forEach(n=>{if(!R[n])return;const s=by(n);D[s.col]=merge(s,D[s.col],R[n]);if(s.col=="ex")D.nx=Math.max(D.nx||1,...D.ex.map(x=>x.no||0).concat(0))+1;if(s.col=="inc")D.ni=Math.max(D.ni||1,...D.inc.map(x=>x.no||0).concat(0))+1;D[s.col].forEach(x=>{if((s.col=="ex"||s.col=="inc")&&!x.no)x.no=s.col=="ex"?D.nx++:D.ni++})});
if(na)rp.push(na+" new workers created from Advances sheet");D.n=nn;save();$("#dlg").close();render();say("Import finished. "+rp.join(" · "))}

const inM=w=>NLS(w.id).filter(n=>n.d.startsWith(gm)),net=ws.map(w=>__bal(w.id,me));

+`<div class="acts" style="flex-wrap:wrap"><button class="nb big" id="xa1">ADD NEW ENTRIES</button><button class="nb big ou" id="xa2">REPLACE (${dn} PURANI HATAO)</button></div><small>ADD: jo entry pehle se hai wo skip, baaki add. <b>REPLACE (sabse sahi, exact):</b> ${DS.all?"is month ki CRM ki saari advance entries":"in companies ki is month ki entries"} hata ke bilkul Excel jaisi bana deta hai.${nb?" <b style='color:#dc2626'>Total match nahi ho raha, to REPLACE dabao.</b>":""} Pehle Excel se ‘Download all data’ backup le lo.</small>`);

<script>
(function(){

const strip=d=>({...d,u:[]}),isO=v=>v&&typeof v=="object"&&!Array.isArray(v),eq=(a,b)=>JSON.stringify(a)==JSON.stringify(b);

function fixD(){try{Object.defineProperty(D,"n",{get(){lastId=Math.max(lastId+1,Date.now()*1000+DEV);return lastId},set(v){},enumerable:false,configurable:true})}catch(e){}}

const idArr=a=>Array.isArray(a)&&a.every(x=>isO(x)&&"id" in x);
function merge3(B,L,S){if(idArr(L)&&idArr(S)&&(!B||idArr(B))){const Bm=new Map((B||[]).map(x=>[x.id,x])),Lm=new Map(L.map(x=>[x.id,x]));let out=S.filter(x=>!(Bm.has(x.id)&&!Lm.has(x.id)));const ix=new Map(out.map((x,i)=>[x.id,i]));
L.forEach(x=>{const b=Bm.get(x.id);/* Concurrent bulk/photo imports: skip only a newly added import if the server already has the same given advance. Keep all pre-existing records and edits. */if(!b&&!ix.has(x.id)&&x.aeBatch&&x.t==="g"&&out.some(a=>a.t==="g"&&String(a.w)===String(x.w)&&a.d===x.d&&Math.round(+a.amt*100)===Math.round(+x.amt*100)))return;if(!b||!eq(x,b)){if(ix.has(x.id))out[ix.get(x.id)]=x;else if(!b){ix.set(x.id,out.length);out.push(x)}}});return out}

return B!==undefined&&eq(L,B)?S:L}

 let list=parsed.data.map((cells,i)=>({cells,line:i+1})).filter(r=>r.cells.some(v=>v.trim())),map={name:0,amount:1,date:2},width=3,headerError='';
 if(list.length){let found={};for(const field of Object.keys(headers))found[field]=list[0].cells.map(N).findIndex(v=>headers[field].includes(v));if(found.name>=0&&found.amount>=0&&found.date>=0){map=found;width=list[0].cells.length;if(Object.values(found).filter(i=>i>=0).length!==width)headerError='Unsupported or repeated header column. Use Worker Name, Amount, Date, and optionally Worker ID / Manager.';list.shift()}}

}
const signature=(w,d,p)=>JSON.stringify([String(w),d,p]);
function check(rows,data,scope,overrides={}){

 return rows.map((raw,i)=>{const r={...raw,...(overrides[i]||{})},errors=[];r.date=dateValue(r.rawDate||r.fallback,r.format);r.cents=cents(r.amount);if(r.structural)errors.push(r.structural);if(!r.date)errors.push('Invalid/missing date. Use a four-digit year.');if(r.cents===null)errors.push('Amount must be positive, with up to 2 decimals.');
 let pool=data.w.filter(w=>!scope||String(w.c)===String(scope));
 if(r.manager){const managers=data.cos.map((c,i)=>({...c,id:i+1})).filter(c=>[N(c.m),N(c.n),String(c.id)].includes(N(r.manager)));if(managers.length!==1)errors.push('Manager not found or ambiguous.');else pool=pool.filter(w=>String(w.c)===String(managers[0].id))}
 if(r.chosen){r.worker=pool.find(w=>String(w.id)===String(r.chosen));if(!r.worker)errors.push('Selected worker is outside this manager.');}
 else if(r.wid){r.worker=pool.find(w=>String(w.id)===String(r.wid).trim());if(!r.worker)errors.push('Worker ID not found in this manager.');else if(r.name&&N(r.name)!==N(r.worker.n))errors.push('Worker ID and name disagree.');}

 });
}

function redraw(){if(tab==='aentry'){upd();drawStatus()}}

let timer,job=0,worker=null,libraryPromise;

async function scan(file){
